                  success:
                    type: boolean
                    enum:
                    - false
                    description: Always false for error responses
                  msg:
                    type: string
                    description: Human-readable error message
                required:
                - success
                - msg
      operationId: getBuyArgsById
      x-mint:
        mcp:
          enabled: true
          name: get-buy-args-by-id
          description: Get the args needed to buy a coin by its id
