  /v1/posts/slug/{slug}:
    put:
      description: 'Update an existing post using its URL slug. The publication is identified by the API key provided in the Authorization header.


        **Behavior:**

        - Only provided fields are updated; omitted fields remain unchanged

        - When `markdown` is provided, it replaces the full content. Rich blocks (embeds, buttons, callouts) created in the editor will be lost

        - Set `status` to `"published"` to publish a draft, `"draft"` to unpublish, or `"archived"` to archive

        - When editing an already-live post that should remain live, include `status: "published"` in the update and verify the returned post status before telling the writer it is live

        - Set `scheduledAt` (Unix timestamp in milliseconds) to schedule a draft''s first-publish for a future time. Must be in the future and at most 30 days out. Only valid for posts that haven''t been published or already scheduled. Pass `scheduledAt: null` to cancel a previously scheduled publish (or to reschedule: cancel first, then schedule again with the new time). Set `sendNewsletter: true` alongside `scheduledAt` to email subscribers when the post publishes.

        - Set `imageUrl` to update the post''s cover/hero image; the URL is fetched, re-hosted, and a placeholder is generated. Pass `clearImage: true` to remove the existing cover.'
      summary: Update a post by slug
      tags:
      - posts
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: URL-friendly identifier of the post to update
      requestBody:
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                markdown:
                  type: string
                  description: Post content in Markdown format. Replaces the FULL body. Markdown cannot represent buttons, linked images, or embedded media (videos, tweets, link cards) — replacing a post that has any of those with `markdown` drops them. Use `bodyJson` (round-tripped from get-post) to edit an existing post so nothing is lost. Provide `markdown` OR `bodyJson`, not both.
                bodyJson:
                  type: string
                  description: Post content as a Tiptap document, JSON-stringified (e.g. '{"type":"doc","content":[...]}'). This accepts ANY Tiptap node the editor supports — including videos, tweets, link cards, callouts, and buttons — so editing a post by round-tripping the `json` returned by get-post preserves everything markdown would drop. Replaces the FULL body; node-type validity is checked by the renderer and an unusable document is rejected. Provide `markdown` OR `bodyJson`, not both.
                title:
                  type: string
                  maxLength: 200
                  description: Title of the post
                subtitle:
                  type: string
                  maxLength: 300
                  description: Optional subtitle or brief summary
                slug:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: URL-friendly identifier for the post
                postPreview:
                  type: string
                  maxLength: 500
                  description: Preview text for the post
                categories:
                  oneOf:
                  - type: array
                    items:
                      type: string
                  - type: string
                  description: Category tags for the post. Can also be a comma-separated string.
                status:
                  type: string
                  enum:
                  - draft
                  - published
                  - archived
                  description: Set to 'published' to publish a draft or keep an already-live post published after edits, 'draft' to unpublish, or 'archived' to archive
                scheduledAt:
                  description: 'Unix timestamp (milliseconds) to schedule the post''s first publish at a future time. Must be in the future and at most 30 days out. Only valid for draft posts that haven''t been published or already scheduled. Cannot be combined with status: ''draft'' or ''archived''. Pass null to cancel a previously scheduled publish. The value 0 is treated the same as omitting the field (no scheduling request); note that on an already-scheduled post, omitting `scheduledAt` while changing `status` cancels the schedule.'
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                sendNewsletter:
                  oneOf:
                  - type: boolean
                  - type: string
                    enum:
                    - 'true'
                    - 'false'
                    - '1'
                    - '0'
                  description: 'Whether to send an email newsletter to subscribers when the post publishes. Only meaningful when publishing (status: ''published'') or scheduling (scheduledAt set). Default: false'
                publishedAt:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: 0
                  description: Unix timestamp (milliseconds) to set as the post's publish date. Once set, the date is preserved across re-publishes.
                imageUrl:
                  type: string
                  format: uri
                  description: 'URL of an image to set as the post''s cover/hero image. The image is fetched, re-hosted on Paragraph''s CDN, and a placeholder is generated. Pass clearImage: true instead to remove the existing cover.'
                clearImage:
                  type: boolean
                  description: When true, removes the post's existing cover/hero image. Ignored if imageUrl is also provided.
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    description: Whether the update succeeded
                required:
                - success
        '400':
          description: Invalid request - check field values
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                    description: Always false for error responses
                  msg:
                    type: string
                    description: Human-readable error message
                required:
                - success
                - msg
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                    description: Always false for error responses
                  msg:
                    type: string
                    description: Human-readable error message
                required:
                - success
                - msg
        '404':
          description: Post not found in your publication
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                    description: Always false for error responses
                  msg:
                    type: string
                    description: Human-readable error message
                required:
                - success
                - msg
        '409':
          description: 'Conflict - the body change was refused because you weren''t working from the post''s current content: either you didn''t call get-post before replacing the body, or the writer edited the post in the editor since you read it. Call get-post to read the current version, re-apply your change on it, and retry.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                    description: Always false for error responses
                  msg:
                    type: string
                    description: Human-readable error message
                required:
                - success
                - msg
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - false
                    description: Always false for error responses
                  msg:
                    type: string
                    description: Human-readable error message
                required:
                - success
                - msg
