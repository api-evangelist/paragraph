deployment:
  mode: both
  endpoint: https://mcp.paragraph.com/mcp
  install: npx @paragraph-com/mcp
  package: https://www.npmjs.com/package/@paragraph-com/mcp
  auth: oauth
  verified: probed
  checked: '2026-08-13'
  note: >-
    Paragraph ships BOTH agent surfaces: a hosted remote endpoint an MCP client can POST to today
    (https://mcp.paragraph.com/mcp, OAuth), and a local stdio server a human installs
    (npx @paragraph-com/mcp, PARAGRAPH_API_KEY). Both are documented verbatim at
    https://docs.paragraph.com/developers/mcp. Corrected from mode:remote on 2026-08-13 — the
    earlier census recorded only the endpoint.
  probe:
    url: https://mcp.paragraph.com/mcp
    method: 'POST tools/list (jsonrpc 2.0, anonymous)'
    http_status: 401
    result: gated
    www_authenticate: >-
      Bearer realm="OAuth",
      resource_metadata="https://mcp.paragraph.com/.well-known/oauth-protected-resource",
      error="invalid_token"
    body: '{"error":"invalid_token","error_description":"Missing or invalid access token"}'
    note: >-
      A correct RFC 9728 challenge — the server names its protected-resource metadata document in
      the WWW-Authenticate header, so an agent can discover how to authenticate. `initialize`
      returns the same 401, so even capability negotiation requires a token.
authorization_server:
  issuer: https://mcp.paragraph.com
  metadata: well-known/paragraph-mcp-oauth-authorization-server.json
  authorization_endpoint: https://mcp.paragraph.com/authorize
  token_endpoint: https://mcp.paragraph.com/token
  registration_endpoint: https://mcp.paragraph.com/register
  dynamic_client_registration: true
  grant_types_supported: [authorization_code, refresh_token]
  code_challenge_methods_supported: [plain, S256]
  scopes_supported: []
  note: >-
    RFC 7591 dynamic client registration is open, so an agent can register itself without a
    human pre-provisioning a client. No scopes are advertised on this server — MCP authorization
    is all-or-nothing for the connected account, unlike the api.read/api.write pair the REST
    resource advertises at paragraph.com.
crosswalk: mcp/paragraph-tool-crosswalk.yml
