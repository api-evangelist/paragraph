findings:
  - >-
    The two surfaces are NOT equivalent projections. Every named MCP tool has a backing REST
    operation (mcp_only is empty), but 25 of 45 REST operations have no named tool — the whole
    coin trading surface (buy/sell argument builders, quotes, popular coins), bulk subscriber
    import, tag browsing, and every by-slug / by-contract / by-wallet lookup variant.
  - >-
    The REST API and the MCP server authenticate against DIFFERENT authorization servers.
    paragraph.com advertises api.read + api.write for the REST resource; mcp.paragraph.com
    advertises no scopes at all. An agent granted MCP access therefore holds a coarser grant than
    one granted REST access, even though the MCP surface is the smaller one.
