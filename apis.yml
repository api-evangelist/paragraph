aid: paragraph
name: Paragraph
description: >-
  Paragraph is a web3-native publishing and newsletter platform where writers get a website,
  a newsletter, an owned subscriber list, and an AI agent that drafts, distributes, and maintains
  their publication. It supports custom domains, Substack import, subscriber management, and
  onchain monetization through writer coins and post coins. Paragraph ships a full public REST
  API (public.api.paragraph.com), an official TypeScript SDK, a CLI, a hosted Model Context
  Protocol server, and published Agent Skills so developers and AI agents can manage posts,
  publications, subscribers, and coins programmatically. Backed by Union Square Ventures.
