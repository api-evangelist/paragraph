notes: >-
  Re-probed 2026-08-13. The material change since 2026-07-20 is the arrival of OAuth 2.0
  discovery metadata on two hosts (RFC 8414 + RFC 9728) and a full authorization server with
  dynamic client registration in front of the MCP endpoint. Paragraph's conformance profile is
  now noticeably stronger on agent/authorization standards than on classic HTTP API hygiene:
  it publishes discovery metadata, content signals and agent skills, but no problem+json, no
  security.txt, no api-catalog, no Sunset policy and no 429 semantics.
